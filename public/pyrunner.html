<style>
:root{
  --bg-void:#0a0b0f;--bg-deep:#0d0f18;--bg-panel:#111420;
  --bg-hover:#1c2030;--bg-active:#1e2438;
  --cyan:#00d4ff;--cyan-dim:rgba(0,212,255,0.15);
  --green:#00e676;--purple:#b57bee;--amber:#ffca28;
  --red:#ff5252;--orange:#ff9800;
  --text-1:#e4e8f4;--text-2:#7a849e;--text-3:#3d4460;
  --border:#181c2e;--border-2:#232840;
  --mono:'JetBrains Mono',monospace;--sans:'Inter',system-ui,sans-serif;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{background:var(--bg-void);color:var(--text-1);font-family:var(--sans);display:flex;flex-direction:column}

/* TOPBAR */
#topbar{
  height:44px;background:var(--bg-deep);border-bottom:1px solid var(--border);
  display:flex;align-items:center;padding:0 14px;gap:10px;flex-shrink:0;position:relative;
}
#topbar::after{
  content:'';position:absolute;bottom:0;left:0;right:0;height:1px;
  background:linear-gradient(90deg,transparent,var(--cyan),var(--purple),transparent);opacity:.35;
}
.brand{display:flex;align-items:center;gap:8px}
.brand-icon{
  width:26px;height:26px;border-radius:6px;
  background:linear-gradient(135deg,var(--cyan),var(--purple));
  display:flex;align-items:center;justify-content:center;font-size:13px;
  box-shadow:0 0 12px rgba(0,212,255,.3);
}
.brand-name{
  font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;
  background:linear-gradient(90deg,var(--cyan),var(--purple));
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
}
.spacer{flex:1}
.status-row{display:flex;align-items:center;gap:6px}
#status-dot{width:7px;height:7px;border-radius:50%;background:var(--amber);flex-shrink:0;animation:dot-pulse 1.4s infinite}
#status-dot.ready{background:var(--green);animation:dot-ready 2.5s infinite}
#status-dot.err{background:var(--red);animation:none}
@keyframes dot-pulse{0%,100%{opacity:1;box-shadow:0 0 5px var(--amber)}50%{opacity:.4;box-shadow:none}}
@keyframes dot-ready{0%,100%{opacity:1;box-shadow:0 0 7px var(--green)}60%{opacity:.7}}
#status-txt{font-family:var(--mono);font-size:10px;color:var(--text-2)}
.seg{display:flex;border:1px solid var(--border-2);border-radius:5px;overflow:hidden}
.seg button{
  background:transparent;border:none;color:var(--text-2);font-family:var(--mono);
  font-size:10px;padding:5px 8px;cursor:pointer;transition:all .15s;
}
.seg button.on{background:var(--bg-active);color:var(--text-1)}
.seg button:hover:not(.on){background:var(--bg-hover);color:var(--text-1)}
.hbtn{
  background:transparent;border:1px solid var(--border-2);color:var(--text-2);
  font-family:var(--mono);font-size:11px;padding:4px 10px;border-radius:5px;
  cursor:pointer;display:flex;align-items:center;gap:5px;transition:all .18s;white-space:nowrap;
}
.hbtn:hover{border-color:var(--text-3);color:var(--text-1);background:var(--bg-hover)}
.hbtn.danger{color:var(--text-2)}
.hbtn.danger:hover{border-color:var(--red);color:var(--red)}
.hbtn.ok{border-color:var(--green);color:var(--green);background:rgba(0,230,118,.06)}
.hbtn.ok:hover{background:rgba(0,230,118,.14)}
#run-btn{
  border-color:var(--cyan);color:#fff;background:rgba(0,212,255,.75);
  padding:6px 20px;font-weight:700;font-size:13px;border-radius:6px;
  box-shadow:0 0 12px rgba(0,212,255,.25);letter-spacing:.03em;
}
#run-btn:hover:not(:disabled){background:rgba(0,212,255,.9);box-shadow:0 0 20px rgba(0,212,255,.4);transform:translateY(-1px)}
#run-btn:disabled{border-color:var(--border-2);color:var(--text-3);cursor:not-allowed;background:transparent;transform:none;box-shadow:none}

/* WORKSPACE */
#workspace{flex:1;display:flex;overflow:hidden;min-height:0}

/* SIDEBAR */
#sidebar{
  background:var(--bg-deep);border-right:1px solid var(--border);
  display:flex;flex-direction:column;flex-shrink:0;transition:width .2s;overflow:hidden;
  width:150px;
}
#sidebar.collapsed{width:0;border-right:none}
.sidebar-hd{
  padding:8px 10px;font-size:9px;font-family:var(--mono);font-weight:600;
  letter-spacing:.14em;text-transform:uppercase;color:var(--text-3);
  border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;
  white-space:nowrap;
}
.sidebar-hd button{background:none;border:none;color:var(--text-3);font-size:12px;cursor:pointer;padding:2px 4px;transition:color .15s}
.sidebar-hd button:hover{color:var(--cyan)}
#file-list{flex:1;overflow-y:auto;padding:4px 0}
.fi{
  display:flex;align-items:center;gap:6px;padding:6px 10px;cursor:pointer;
  transition:all .13s;border-left:2px solid transparent;
}
.fi:hover{background:var(--bg-hover)}
.fi.on{background:var(--bg-active);border-left-color:var(--cyan)}
.fi .ficon{font-size:11px;color:#4a90d9;flex-shrink:0}
.fi.on .ficon{color:var(--cyan)}
.fi .fname{font-size:11px;font-family:var(--mono);color:var(--text-2);flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fi.on .fname{color:var(--text-1)}
.fi .fdel{display:none;background:none;border:none;cursor:pointer;color:var(--text-3);font-size:10px;padding:1px 3px;transition:color .13s}
.fi .fdel:hover{color:var(--red)}
.fi:hover .fdel{display:block}

/* QUICK REFERENCE */
#ref-panel{border-top:1px solid var(--border);overflow-y:auto;flex:1}
.ref-hd{
  padding:6px 10px;font-size:9px;font-family:var(--mono);font-weight:600;
  letter-spacing:.14em;text-transform:uppercase;color:var(--text-3);
  display:flex;justify-content:space-between;align-items:center;cursor:pointer;
  border-bottom:1px solid var(--border);white-space:nowrap;
  position:sticky;top:0;background:var(--bg-deep);z-index:1;
}
.ref-hd:hover{color:var(--text-2)}
.ref-hd i{font-size:9px;transition:transform .2s}
.ref-hd.open i{transform:rotate(90deg)}
.ref-body{display:none;padding:6px 0}
.ref-body.open{display:block}
.ref-item{padding:4px 10px;cursor:pointer;transition:background .13s}
.ref-item:hover{background:var(--bg-hover)}
.ref-item .ref-label{font-size:10px;font-family:var(--mono);color:var(--cyan);font-weight:600;margin-bottom:2px}
.ref-item .ref-code{font-size:10px;font-family:var(--mono);color:var(--text-3);background:var(--bg-void);border-radius:3px;padding:3px 6px;margin-top:3px;white-space:pre;display:block;border-left:2px solid var(--border-2)}
.ref-item:hover .ref-code{border-left-color:var(--cyan)}

/* EDITOR ZONE */
#editor-zone{display:flex;flex-direction:column;overflow:hidden;background:#1e1e1e;flex:1;min-width:0;position:relative}
#editor-toolbar{
  background:#252526;display:flex;align-items:center;padding:4px 8px;gap:6px;
  border-bottom:1px solid #1a1a1a;flex-shrink:0;overflow-x:auto;
}
#tabs-bar{
  background:#252526;display:flex;height:32px;flex-shrink:0;
  overflow-x:auto;border-bottom:1px solid #1a1a1a;
}
.tab{
  display:flex;align-items:center;gap:5px;padding:0 12px;
  font-size:11px;font-family:var(--mono);cursor:pointer;
  white-space:nowrap;height:100%;border-right:1px solid #1a1a1a;
  color:#777;transition:all .13s;
}
.tab:hover{color:#bbb;background:#2a2a2a}
.tab.on{color:#e0e0e0;background:#1e1e1e;border-top:2px solid var(--cyan)}
.tab .ti{font-size:10px;color:#4a90d9}
.tab.on .ti{color:var(--cyan)}
#editor-container{flex:1;position:relative;overflow:hidden}
#ed-load{
  position:absolute;inset:0;display:flex;flex-direction:column;
  align-items:center;justify-content:center;background:#1e1e1e;gap:14px;z-index:10;
}
.spinner{width:32px;height:32px;border:2px solid #2a2a2a;border-top-color:var(--cyan);border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.ed-load-txt{font-family:var(--mono);font-size:11px;color:var(--text-3)}
.err-line-bg{background:rgba(255,82,82,.14)!important}
.err-line-glyph{background:var(--red);width:3px!important;margin-left:3px}

/* ERRORS */
#err-banner{
  position:absolute;top:6px;left:50%;transform:translateX(-50%);
  z-index:20;background:#3a1a1a;border:1px solid var(--red);
  color:#ffdada;font-family:var(--mono);font-size:11px;
  padding:7px 12px 7px 10px;border-radius:6px;display:none;align-items:center;gap:8px;
  max-width:90%;box-shadow:0 4px 24px rgba(0,0,0,.4);
}
#err-banner.show{display:flex}
#err-banner .eb-close{background:none;border:none;color:#ffb0b0;cursor:pointer;font-size:12px}
.err-card{background:rgba(255,82,82,.05);border:1px solid rgba(255,82,82,.28);border-radius:10px;margin:8px 0;overflow:hidden}
.err-card-hd{display:flex;align-items:center;gap:8px;padding:9px 14px;background:rgba(255,82,82,.07);border-bottom:1px solid rgba(255,82,82,.13)}
.err-card-emoji{font-size:15px}
.err-card-title{font-size:11px;font-weight:700;color:#ff8080;font-family:var(--mono);flex:1}
.err-card-loc{font-size:10px;color:#ff5252;background:rgba(255,82,82,.15);padding:1px 6px;border-radius:4px;font-family:var(--mono)}
.err-card-body{padding:10px 14px;display:flex;flex-direction:column;gap:7px}
.err-card-raw{font-size:11px;font-family:var(--mono);color:#c09090;background:rgba(0,0,0,.25);border-radius:6px;padding:7px 10px;white-space:pre-wrap;word-break:break-word;border-left:3px solid rgba(255,82,82,.4)}
.err-card-tip{font-size:12px;color:#ffe0a0;display:flex;gap:7px;background:rgba(255,200,80,.05);border-left:2px solid var(--amber);padding:5px 8px;border-radius:0 4px 4px 0}

/* OUTPUT */
#out-panel{
  background:var(--bg-void);border-left:1px solid var(--border);
  display:flex;flex-direction:column;min-width:160px;
}
#out-toolbar{
  background:var(--bg-deep);border-bottom:1px solid var(--border);
  display:flex;align-items:center;padding:4px 10px;gap:6px;flex-shrink:0;
}
#exec-time{font-family:var(--mono);font-size:10px;color:var(--text-3);flex:1;text-align:right;padding-right:4px}
#terminal{
  flex:1;padding:12px 14px;background:var(--bg-void);
  font-family:var(--mono);font-size:13px;line-height:1.8;
  overflow-y:auto;color:#c5cde0;white-space:pre-wrap;word-break:break-word;
}
.t-prompt{color:var(--green)}.t-err{color:var(--red)}.t-sys{color:var(--purple)}.t-warn{color:var(--amber)}.t-in{color:#fff}
#input-row{
  display:none;align-items:center;
  background:var(--bg-panel);border-top:1px solid var(--border-2);
  padding:7px 12px;gap:8px;flex-shrink:0;
}
.in-arrow{font-family:var(--mono);font-size:14px;color:var(--green);flex-shrink:0}
#term-input{flex:1;background:transparent;border:none;color:#fff;font-family:var(--mono);font-size:13px;outline:none;caret-color:var(--cyan)}

/* STATUS BAR */
#statusbar{
  background:var(--bg-deep);border-top:1px solid var(--border);
  height:22px;display:flex;align-items:center;padding:0 12px;
  justify-content:space-between;flex-shrink:0;
}
.sb-left,.sb-right{display:flex;align-items:center;gap:12px;font-family:var(--mono);font-size:10px;color:var(--text-3)}

/* BOOT */
#boot{
  position:fixed;inset:0;background:var(--bg-void);z-index:200;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;
  transition:opacity .5s;overflow:hidden;
}
.boot-logo{
  font-size:clamp(22px,7vw,48px);font-weight:800;letter-spacing:.1em;
  background:linear-gradient(90deg,var(--cyan),var(--purple),var(--cyan));
  background-size:200%;
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
  animation:logo-shine 3s linear infinite;position:relative;z-index:1;
}
@keyframes logo-shine{0%{background-position:0%}100%{background-position:200%}}
.boot-sub{font-family:var(--mono);font-size:12px;color:var(--text-3);position:relative;z-index:1}
.boot-bar-wrap{width:260px;height:2px;background:var(--border-2);border-radius:2px;overflow:hidden;position:relative;z-index:1}
.boot-bar{height:100%;background:linear-gradient(90deg,var(--cyan),var(--purple));width:0;transition:width .12s linear;}
#boot-msg{font-family:var(--mono);font-size:11px;color:var(--cyan);letter-spacing:.04em;position:relative;z-index:1}

/* MODALS */
#modal-bg,#share-modal,#shortcut-modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:300;align-items:center;justify-content:center;backdrop-filter:blur(3px)}
#modal-bg.open,#share-modal.open,#shortcut-modal.open{display:flex}
.modal,.sc-box,.share-box{background:var(--bg-panel);border:1px solid var(--border-2);border-radius:10px;padding:20px;width:280px;}
.modal h3,.share-box h3,.sc-box h3{font-size:13px;font-weight:600;margin-bottom:12px;color:var(--text-1)}
.modal input,.share-url input{width:100%;background:var(--bg-void);border:1px solid var(--border-2);color:var(--text-1);font-family:var(--mono);font-size:12px;padding:7px 10px;border-radius:5px;outline:none;margin-bottom:12px;}
.modal-actions,.share-actions{display:flex;gap:8px;justify-content:flex-end}
.mbtn{font-family:var(--mono);font-size:11px;padding:6px 12px;border-radius:5px;cursor:pointer;border:1px solid var(--border-2);background:transparent;color:var(--text-2)}
.mbtn:hover{background:var(--bg-hover);color:var(--text-1)}
.mbtn.primary{border-color:var(--cyan);color:var(--cyan);background:rgba(0,212,255,.07)}
.mbtn.primary:hover{background:rgba(0,212,255,.15)}
.share-box{width:380px}
.share-url{display:flex;gap:6px;margin-bottom:12px}

/* TOAST */
#toast{
  position:fixed;bottom:36px;left:50%;transform:translateX(-50%) translateY(20px);
  background:var(--bg-panel);border:1px solid var(--border-2);color:var(--text-1);
  font-family:var(--mono);font-size:11px;padding:8px 16px;border-radius:20px;
  opacity:0;transition:all .25s;pointer-events:none;z-index:500;
}

/* MOBILE RESPONSIVE */
@media(max-width:700px){
  html,body{height:100%;height:100dvh;overflow:hidden;}
  body{display:grid;grid-template-rows:52px 1fr 68px;grid-template-columns:1fr;}
  #sidebar{display:flex!important;position:fixed!important;top:0;left:0;bottom:0;width:220px!important;z-index:200;transform:translateX(-100%);transition:transform .25s ease;}
  #sidebar.mobile-open{transform:translateX(0)!important}
  #mobile-sidebar-backdrop{display:none;position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:199;}
  #mobile-sidebar-backdrop.open{display:block}
  
  /* Replace standard textarea with CM5 container styling */
  #mobile-editor-container{display:none;flex:1;width:100%;height:100%;background:#1a1a2e;}
  .CodeMirror{height:100%!important;font-family:"JetBrains Mono",monospace;font-size:14px;}

  #statusbar,#editor-toolbar,#out-toolbar,#tabs-bar,#status-txt{display:none!important}
  .seg[title="Font size"],.seg[title="Theme"],#topbar-share-btn,#topbar-shortcut-btn,#run-btn{display:none!important}
  #topbar{grid-row:1;height:52px;padding:0 12px;z-index:10;}
  #workspace{grid-row:2;position:relative;overflow:hidden;display:block!important;}
  #editor-zone{position:absolute;top:0;left:0;right:0;bottom:0;width:100%!important;height:100%!important;border:none!important;display:flex!important;transform:translateX(0);transition:transform .28s;}
  #out-panel{position:absolute;top:0;left:0;right:0;bottom:0;width:100%!important;height:100%!important;border:none!important;display:flex!important;transform:translateX(100%);transition:transform .28s;}
  body.mobile-output #editor-zone{transform:translateX(-100%)}
  body.mobile-output #out-panel{transform:translateX(0)}
  #mobile-bar{
    grid-row:3;display:flex!important;height:68px;padding:10px 14px;
    background:var(--bg-deep);border-top:1px solid var(--border-2);gap:10px;
  }
  #mobile-bar button{
    flex:1;height:46px;border-radius:10px;font-size:13px;font-weight:600;
    font-family:var(--mono);border:1px solid var(--border-2);background:var(--bg-panel);color:var(--text-2);
  }
  #run-btn-mobile{
    flex:2.2!important;background:linear-gradient(135deg,#00c8f0,#00a8d4)!important;
    border-color:#00d4ff!important;color:#fff!important;font-size:15px!important;
  }
  #mobile-output-back{display:none!important}
  body.mobile-output #mobile-output-back{display:flex!important}
  body.mobile-output #mobile-save-btn,body.mobile-output #mobile-clear-btn{display:none!important}
}
@media(min-width:701px){#mobile-bar{display:none!important}}
</style>

<body>

<div id="boot">
  <div class="boot-logo">PyRunner Apex</div>
  <div class="boot-sub">// The fastest Python 3 compiler in your browser</div>
  <div class="boot-bar-wrap"><div class="boot-bar" id="boot-bar"></div></div>
  <div id="boot-msg">Starting up...</div>
</div>

<div id="modal-bg">
  <div class="modal">
    <h3>New file</h3>
    <input type="text" id="modal-inp" placeholder="utils.py" autocomplete="off">
    <div class="modal-actions">
      <button class="mbtn" onclick="closeModal()">Cancel</button>
      <button class="mbtn primary" onclick="confirmNew()">Create</button>
    </div>

</div>

  <div class="share-box">
    <h3>Share your code</h3>

    <div class="share-url">

<input type="file" id="file-input" accept=".py,text/x-python,text/plain" style="display:none">

<div id="topbar">
  <button class="hbtn" onclick="toggleSidebar()" id="sidebar-btn"><i class="fa-solid fa-bars"></i></button>
  <div class="brand">
    <div class="brand-icon"><i class="fa-brands fa-python" style="color:#fff"></i></div>

  </div>

    <div id="status-dot"></div>
    <span id="status-txt">Loading engine...</span>
  </div>
  <button class="hbtn" onclick="openShareModal()">Share</button>
</div>

<div id="mobile-sidebar-backdrop" onclick="closeMobileSidebar()"></div>

<div id="workspace">
  <div id="sidebar">
    <div class="sidebar-hd">
      <span>Files</span>
      <div style="display:flex;gap:2px">
        <button onclick="openModal()"><i class="fa-solid fa-plus"></i></button>
      </div>
    </div>
    <div id="file-list"></div>
  </div>

  <div id="editor-zone">
    <div id="editor-toolbar">
      <button class="hbtn" onclick="saveFile()">Save .py</button>
      <button class="hbtn danger" onclick="clearCode()">Clear</button>
      <span id="pkg-stat" style="font-family:var(--mono);font-size:10px;color:var(--text-3);margin-left:auto;margin-right:6px">stdlib</span>
    </div>
    <div id="tabs-bar"></div>
    <div id="editor-container">
      <textarea id="mobile-editor" style="display:none"></textarea>
      <div id="ed-load"><div class="spinner"></div></div>
      <div id="err-banner"><span class="eb-msg" id="eb-msg"></span><button class="eb-close" onclick="hideErrBanner()">x</button></div>

    <div id="out-toolbar">
      <button class="hbtn danger" onclick="clearOut()">Clear Output</button>
      <span id="exec-time"></span>
      <button id="run-btn" class="hbtn" disabled onclick="runCode()">Run</button>

    <div id="terminal"></div>
    <div id="input-row">

<div id="mobile-bar">
  <button id="mobile-save-btn" onclick="saveFile()">Save</button>
  <button id="mobile-clear-btn" onclick="clearCode()">Clear</button>
  <button id="mobile-output-back" onclick="mobileBack()" style="display:none">Editor</button>
  <button onclick="toggleSidebar()" style="flex:0 0 auto;min-width:44px">☰</button>
  <button id="run-btn-mobile" disabled onclick="runCode()">Run</button>
</div>

<div id="statusbar">
  <div class="sb-left"><span class="sb-item">Python 3.11</span></div>
</div>

<script>
// --- STATE & VFS ---
let vfs = { 'main.py': 'print("Hello, World!", end="")\nprint(" This works perfectly now!")\n' };
try {
  const savedVfs = localStorage.getItem('pyr_vfs');
  if (savedVfs) vfs = JSON.parse(savedVfs);
} catch(e) {}
let currentFile = 'main.py';

let editor = null;
let mobileEditorInstance = null;
let pyodide = null;
let inputResolver = null;
let isDark = true;
let errDecorations = [];
let lastError = null;

const $ = id => document.getElementById(id);
const terminal = $('terminal');
const runBtn = $('run-btn');

function saveToLocal() {
  try { localStorage.setItem('pyr_vfs', JSON.stringify(vfs)); } catch(_) {}
}

// --- TERMINAL ---
window.tAppendStream = function(text, cls) {
  if (!text) return;
  const lines = text.split('\n');
  for (let i = 0; i < lines.length; i++) {
    if (lines[i]) {
      let target = terminal.lastElementChild;
      // Append to existing node if it's not a line break or prompt
      if (!target || target.tagName === 'BR' || target.className === 't-prompt' || (cls && target.className !== cls)) {
        target = document.createElement('span');
        if (cls) target.className = cls;
        terminal.appendChild(target);
      }
      target.textContent += lines[i];
    }
    // Add real DOM line breaks for standard batched line ends
    if (i < lines.length - 1) {
      terminal.appendChild(document.createElement('br'));
    }
  }
  terminal.scrollTop = terminal.scrollHeight;
};

// Override original batched behavior to funnel through our unbuffered raw stream handler
function tAppend(text, cls) {
  window.tAppendStream(text + '\n', cls);
}
const _origTAppend = tAppend;
window.tAppend = function(text, cls) {
  _origTAppend(text, cls);
  if (cls === 't-err' && text) {
    const tip = getFriendlyTip(text);
    if (tip) _origTAppend(tip, 't-sys');
  }
};
function tRaw(html) {
  const d = document.createElement('span');
  d.innerHTML = html;
  terminal.appendChild(d);
  terminal.appendChild(document.createElement('br'));
  terminal.scrollTop = terminal.scrollHeight;
}

function clearCode() {
  if (!confirm('Clear all code in this file?')) return;
  vfs[currentFile] = '';
  if (mobileEditorInstance) mobileEditorInstance.setValue('');
  else if (editor) editor.setValue('');
  saveToLocal();
  hideErrBanner();
}
function clearOut() {
  terminal.innerHTML = '';
  const _et=$('exec-time'); if(_et)_et.textContent='';
  hideErrBanner();
}
function showToast(msg, type='ok') {
  const t = document.createElement('div');
  t.textContent = msg;
  t.style.cssText = `position:fixed;bottom:40px;left:50%;transform:translateX(-50%);background:#1e2438;border:1px solid ${type==='ok'?'#00e676':'#00d4ff'};color:${type==='ok'?'#00e676':'#00d4ff'};font-family:var(--mono);font-size:11px;padding:6px 16px;border-radius:6px;z-index:999;opacity:1;transition:opacity .4s`;
  document.body.appendChild(t);
  setTimeout(() => { t.style.opacity = '0'; setTimeout(() => t.remove(), 400); }, 1800);
}
function escHTML(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

// --- FILE SYSTEM UI ---
function renderUI() {
  const fl = $('file-list'), tabs =$('tabs-bar');
  fl.innerHTML = ''; tabs.innerHTML = '';
  Object.keys(vfs).forEach(fn => {
    const active = fn === currentFile;
    const safeFn = escHTML(fn);
    const fi = document.createElement('div');
    fi.className = 'fi' + (active ? ' on' : '');
    fi.innerHTML = `<span class="fname">${safeFn}</span>${fn !== 'main.py' ? `<button class="fdel" onclick="event.stopPropagation();delFile(this.dataset.fn)"><i class="fa-solid fa-xmark"></i></button>` : ''}`;
    if (fn !== 'main.py') fi.querySelector('.fdel').dataset.fn = fn;
    fi.addEventListener('click', () => switchFile(fn));
    fl.appendChild(fi);
    const tab = document.createElement('div');
    tab.className = 'tab' + (active ? ' on' : '');
    tab.innerHTML = safeFn;
    tab.addEventListener('click', () => switchFile(fn));
    tabs.appendChild(tab);
  });
}
function switchFile(fn) {
  currentFile = fn;
  hideErrBanner();
  renderUI();
  if (mobileEditorInstance) { mobileEditorInstance.setValue(vfs[fn]); mobileEditorInstance.focus(); }
  else if (editor) { editor.setValue(vfs[fn]); editor.focus(); }
}
function delFile(fn) {
  if (!confirm(`Delete ${fn}?`)) return;
  delete vfs[fn];
  saveToLocal();
  if (currentFile === fn) currentFile = 'main.py';
  renderUI();
  if (mobileEditorInstance) mobileEditorInstance.setValue(vfs[currentFile]);
  else if (editor) editor.setValue(vfs[currentFile]);
}
function openModal() { $('modal-inp').value = ''; $('modal-bg').classList.add('open'); setTimeout(() =>$('modal-inp').focus(), 40); }
function closeModal() { $('modal-bg').classList.remove('open'); }
function confirmNew() {
  let fn = $('modal-inp').value.trim();
  if (!fn) return;
  if (!fn.endsWith('.py')) fn += '.py';
  if (vfs[fn]) { alert('File already exists!'); return; }
  vfs[fn] = `# ${fn}\n`;
  saveToLocal();
  currentFile = fn;
  closeModal();
  renderUI();
  if (mobileEditorInstance) mobileEditorInstance.setValue(vfs[fn]);
  else if (editor) editor.setValue(vfs[fn]);
}

// --- INITIALIZE EDITORS ---
function loadMonaco(cb) {
  const s = document.createElement('script');
  s.src = 'https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.43.0/min/vs/loader.js';
  s.onload = () => {
    require.config({ paths: { vs: 'https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.43.0/min/vs' } });
    require(['vs/editor/editor.main'], () => {
      $('ed-load').style.display = 'none';
      editor = monaco.editor.create($('editor-container'), {
        value: vfs[currentFile],
        language: 'python',
        theme: 'vs-dark',
        automaticLayout: true,
        minimap: { enabled: false },
        fontSize: 14,
        fontFamily: "'JetBrains Mono', monospace",
        scrollBeyondLastLine: false,
      });
      editor.onDidChangeModelContent(() => {
        vfs[currentFile] = editor.getValue();
        saveToLocal();
      });
      cb();
    });
  };
  document.body.appendChild(s);
}

function initMobileEditor() {
  $('ed-load').style.display = 'none';
  const me = $('mobile-editor');
  
  mobileEditorInstance = CodeMirror.fromTextArea(me, {
    mode: 'python',
    theme: 'monokai',
    lineNumbers: true,
    indentUnit: 4,
    lineWrapping: true
  });
  mobileEditorInstance.setValue(vfs[currentFile]);
  mobileEditorInstance.on('change', () => {
    vfs[currentFile] = mobileEditorInstance.getValue();
    saveToLocal();
  });
}

// --- BOOT PYODIDE 0.27.2 ---
async function loadPy(cb) {
  const s = document.createElement('script');
  s.src = 'https://cdn.jsdelivr.net/pyodide/v0.27.2/full/pyodide.js';
  s.onload = async () => {
    try {
      pyodide = await globalThis.loadPyodide({ indexURL: 'https://cdn.jsdelivr.net/pyodide/v0.27.2/full/' });
      
      globalThis._js_input_fn = (prompt) => {
        if (prompt) window.tAppendStream(prompt);
        $('input-row').style.display = 'flex';
        $('term-input').value = '';$('term-input').focus();
        return new Promise(resolve => { inputResolver = resolve; });
      };

      await pyodide.runPythonAsync(`
import builtins, ast, sys
from js import _js_input_fn, Date, tAppendStream

# Issue #3 Fix: Bypass Pyodide buffering completely
class JSStream:
    def __init__(self, is_err=False):
        self.is_err = is_err
    def write(self, s):
        tAppendStream(s, 't-err' if self.is_err else '')
        return len(s)
    def flush(self): pass

sys.stdout = JSStream(False)
sys.stderr = JSStream(True)

# Issue #11 Fix: Safe Thread Kill Switch (Timeout) without Web Workers
class ExecutionTimeout:
    def __init__(self, limit_ms=3000):
        self.limit = limit_ms
        self.start = Date.now()
    def trace(self, frame, event, arg):
        if Date.now() - self.start > self.limit:
            sys.settrace(None)
            raise TimeoutError("Execution time limit exceeded (Infinite loop protection).")
        return self.trace
    def reset(self):
        self.start = Date.now()

_timeout_tracker = ExecutionTimeout()

async def _async_input(prompt=""):
    _timeout_tracker.reset()
    result = await _js_input_fn(str(prompt) if prompt else "")
    _timeout_tracker.reset()
    return str(result)
builtins.input = _async_input

class _InputToAwait(ast.NodeTransformer):
    def visit_Call(self, node):
        self.generic_visit(node)
        if isinstance(node.func, ast.Name) and node.func.id == 'input':
            return ast.Await(value=node)
        return node

def _transform_user_code(source):
    try: tree = ast.parse(source)
    except SyntaxError: return source 
    tree = _InputToAwait().visit(tree)
    ast.fix_missing_locations(tree)
    wrapper = ast.parse("async def __main__(): pass\\nawait __main__()")
    wrapper.body[0].body = tree.body if tree.body else [ast.Pass()]
    ast.fix_missing_locations(wrapper)
    return ast.unparse(wrapper)

import js
js.globalThis._py_transform = _transform_user_code
js.globalThis._timeout_tracker = _timeout_tracker
`);
      cb();
    } catch (e) {
      $('status-dot').classList.add('err');$('status-txt').textContent = 'Engine failed';
    }
  };
  document.body.appendChild(s);
}

// --- RUN PIPELINE ---
async function runCode() {
  if (!pyodide) return;
  runBtn.disabled = true;
  clearOut();
  tRaw(`<span class="t-prompt">❯ python ${escHTML(currentFile)}</span>`);
  const t0 = performance.now();

  for (const [fn, code] of Object.entries(vfs)) {
    try { pyodide.FS.writeFile('/' + fn, code); } catch (_) {}
  }

  try {
    await pyodide.loadPackagesFromImports(Object.values(vfs).join('\n'));
    const userCode = vfs[currentFile] || vfs['main.py'];
    const transformed = globalThis._py_transform(userCode);
    
    // Enable loop killswitch
    globalThis._timeout_tracker.reset();
    await pyodide.runPythonAsync(`import sys; sys.settrace(_timeout_tracker.trace)`);
    
    await pyodide.runPythonAsync(transformed);
  } catch (err) {
    const msg = err.message || String(err);
    window.tAppendStream('\n' + msg, 't-err');
  } finally {
    await pyodide.runPythonAsync(`import sys; sys.settrace(None)`); // Release switch
    const ms = ((performance.now() - t0) / 1000).toFixed(2);
    window.tAppendStream(`\nFinished in ${ms}s`, 't-sys');
    runBtn.disabled = false;
    if (!inputResolver) $('input-row').style.display = 'none';
  }
}

// --- INPUT ---
function submitInput() {
  if (!inputResolver) return;
  const val = $('term-input').value;
  window.tAppendStream(val + '\n', 't-in');
  $('term-input').value = '';
  const res = inputResolver;
  inputResolver = null;
  $('input-row').style.display = 'none';
  res(val);
}
$('term-input').addEventListener('keydown', e => { if (e.key === 'Enter') submitInput(); });

// --- SHARE URL LZSTRING ---
function openShareModal() {
  const compressed = LZString.compressToEncodedURIComponent(JSON.stringify(vfs));
  const url = location.origin + location.pathname + '?code=' + compressed;
  $('share-url-input').value = url;
  $('share-modal').classList.add('open');
}
function closeShareModal() { $('share-modal').classList.remove('open'); }
function copyShareUrl() {
  navigator.clipboard.writeText($('share-url-input').value).then(() => showToast('Link copied!'));
}
function loadSharedCode() {
  try {
    const code = new URLSearchParams(location.search).get('code');
    if (code) {
      const decompressed = LZString.decompressFromEncodedURIComponent(code);
      if (decompressed && decompressed.startsWith('{')) {
        vfs = JSON.parse(decompressed);
      } else {
        vfs['main.py'] = decodeURIComponent(escape(atob(code))); // Backward compatibility
      }
      currentFile = Object.keys(vfs)[0] || 'main.py';
      renderUI();
      if (mobileEditorInstance) mobileEditorInstance.setValue(vfs[currentFile]);
      else if (editor) editor.setValue(vfs[currentFile]);
      showToast('Shared project loaded!', 'ok');
    }
  } catch(_) {}
}

const FRIENDLY_ERRORS = [
  { match: /NameError.*name '(.+?)' is not defined/, tip: (m) => `💡 "${m[1]}" doesn't exist yet.` },
  { match: /SyntaxError.*invalid syntax/, tip: () => `💡 Python can't read this line. Check for missing colons (:) or brackets.` },
  { match: /TimeoutError/, tip: () => `💡 Infinite loop protection triggered. Your code ran for 3 seconds without input.` }
];
function getFriendlyTip(msg) {
  for (const { match, tip } of FRIENDLY_ERRORS) {
    const m = msg.match(match);
    if (m) return tip(m);
  }
  return null;
}

// --- BOOT ANIMATION ---
function boot(steps, done) {
  let i = 0;
  const go = () => {
    if (i >= steps.length) { done(); return; }
    const [pct, txt, ms] = steps[i++];
    $('boot-bar').style.width = pct + '\%';$('boot-msg').textContent = txt;
    setTimeout(go, ms);
  };
  go();
}

window.onload = () => {
  renderUI();
  boot([[20,'Loading Editor...', 150],[60,'Fetching Pyodide v0.27.2...', 300],[100,'Ready.', 100]], () => {
    $('boot').style.display = 'none';
    if (window.innerWidth <= 700) {
      initMobileEditor();
      loadPy(() => { $('status-dot').classList.add('ready'); runBtn.disabled = false; loadSharedCode(); });
    } else {
      Split(['#sidebar', '#editor-zone', '#out-panel'], { sizes: [14, 48, 38], onDragEnd: () => { if (editor) editor.layout(); } });
      loadMonaco(() => {
        loadPy(() => { $('status-dot').classList.add('ready'); runBtn.disabled = false; loadSharedCode(); });
      });
    }
  });
};

function toggleSidebar() {
  if (window.innerWidth<=700) $('sidebar').classList.toggle('mobile-open');
  else {
    const sb = $('sidebar');
    const collapsed = sb.classList.toggle('collapsed');
    sb.style.width = collapsed ? '0' : '150px';
    if (editor) setTimeout(() => editor.layout(), 230);
  }
}
function mobileBack() { document.body.classList.remove('mobile-output'); }
const _origRunCode = window.runCode;
window.runCode = async function() { if (window.innerWidth <= 700) document.body.classList.add('mobile-output'); await _origRunCode(); };
if ($('run-btn-mobile'))$('run-btn-mobile').onclick = () => window.runCode();
</script>
</body>
